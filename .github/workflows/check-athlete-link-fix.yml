name: Check Athlete Link Fix

on:
  push:
    branches:
      - fix-stale-athlete-user-link-v2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check hook syntax
        run: node --check athlete-link-recovery-hook.js
      - name: Validate V9/V2 batch
        run: node scripts/validate-v9-batch.mjs
