name: Mantener RunFlow despierto

# Render (plan gratis) apaga el servidor tras 15 minutos sin visitas y la
# primera entrada tarda 30-60 s en despertarlo. Este aviso lo visita cada
# 10 minutos para que el Coach y la app abran al momento.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://runflow-online-pilot.onrender.com/health; then exit 0; fi
            sleep 10
          done
          echo "RunFlow no ha respondido" >&2
          exit 1
