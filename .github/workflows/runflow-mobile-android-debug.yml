name: RunFlow Coach Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        # El runner ya trae el SDK de Android; setup-android@v3 falla en el runner actual.
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Coach app
        working-directory: mobile
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.runflow.coach",
            "appName": "RunFlow Coach",
            "webDir": "www",
            "server": {
              "url": "https://runflow-online-pilot.onrender.com/login",
              "cleartext": false
            },
            "plugins": {
              "SystemBars": { "insetsHandling": "disable" }
            }
          }
          EOF

      - name: Prepare Capacitor Android
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
          node scripts/android-system-bars.cjs

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RunFlow-Coach-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
