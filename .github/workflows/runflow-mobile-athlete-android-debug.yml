name: RunFlow Athlete Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/runflow-mobile-athlete-android-debug.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # El runner ya trae el Android SDK; se usa directamente en lugar de setup-android.
      - name: Install Android SDK 36
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Athlete app
        working-directory: mobile
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.runflow.athlete",
            "appName": "RunFlow Athlete",
            "webDir": "www",
            "server": {
              "url": "https://runflow-online-pilot.onrender.com/login?mode=athlete",
              "cleartext": false
            },
            "plugins": {
              "SystemBars": { "insetsHandling": "disable" }
            }
          }
          EOF

      - name: Prepare Capacitor Android
        working-directory: mobile
        run: |
          npm install
          npm install --no-save @capacitor/assets
          npx cap add android
          npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#B7F34A' --iconBackgroundColorDark '#B7F34A'
          npx cap sync android
          node scripts/android-system-bars.cjs

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RunFlow-Athlete-Android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Descarga directa desde el móvil (sin entrar en GitHub ni descomprimir):
      # https://github.com/Urtzivi/runflow-online/releases/download/athlete-apk-latest/RunFlow-Athlete.apk
      - name: Publish APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk RunFlow-Athlete.apk
          if ! gh release view athlete-apk-latest >/dev/null 2>&1; then
            gh release create athlete-apk-latest --prerelease --target "$GITHUB_SHA" \
              --title "RunFlow Athlete APK (última)" \
              --notes "APK de prueba de RunFlow Athlete. Se sustituye en cada compilación."
          fi
          gh release upload athlete-apk-latest RunFlow-Athlete.apk --clobber
