<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f4ef">
  <title>RunFlow Athlete V2 · Beta</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css?v=2.4.2.2">
  <link rel="stylesheet" href="/css/athlete-v4.css?v=4.0.0">
  <link rel="stylesheet" href="/css/athlete-v2-beta.css?v=2.0.3">
  <link rel="stylesheet" href="/css/athlete-v2-complete.css?v=2.1.0">
</head>
<body class="athlete-v2-body athlete-v2-beta">
  <div class="athlete-v2-beta-banner"><strong>RUNFLOW ATHLETE V2 · BETA</strong><span>Versión de prueba independiente. La app actual sigue intacta.</span></div>
  <main id="athleteV2Mount"><div style="padding:40px;text-align:center">Comprobando acceso…</div></main>
  <script>
    (async()=>{
      const fail=()=>location.replace('/login-beta.html?target=athlete-v2');
      try{
        const response=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});
        if(!response.ok)return fail();
        const data=await response.json();
        if(!Array.isArray(data?.user?.roles)||!data.user.roles.includes('athlete'))return fail();
        localStorage.setItem('runflow_client','athlete');
        const base=await fetch('/athlete.html',{credentials:'same-origin',cache:'no-store'});
        if(!base.ok)throw new Error('No se pudo cargar Athlete base');
        const html=await base.text();
        const doc=new DOMParser().parseFromString(html,'text/html');
        const main=doc.querySelector('main.athlete-v2-shell');
        const nav=doc.querySelector('nav.athlete-bottom-nav');
        const modals=[...doc.body.querySelectorAll(':scope > .modal-backdrop')];
        const mount=document.getElementById('athleteV2Mount');
        if(main)mount.replaceWith(main);
        if(nav)document.body.appendChild(nav);
        modals.forEach(m=>document.body.appendChild(m));
        const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s);});
        await load('/js/athlete.js?v=2.4.2.2');
        await load('/js/athlete-v2-beta.js?v=2.0.3');
        await load('/js/athlete-v2-complete.js?v=2.1.0');
      }catch(error){fail();}
    })();
  </script>
</body>
</html>
