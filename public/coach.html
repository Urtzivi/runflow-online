<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#b9f34d">
  <title>RunFlow Coach</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/app.css?v=2.4.2.2">
  <link rel="stylesheet" href="/css/coach-v8.css?v=8.0.0">
  <link rel="stylesheet" href="/css/coach-v8-validated.css?v=8.4.1">
  <link rel="stylesheet" href="/css/coach-v8-delete.css?v=8.4.2">
  <link rel="stylesheet" href="/css/coach-v8-guided-flow.css?v=8.6.0">
  <link rel="stylesheet" href="/css/coach-v8-season-map.css?v=8.6.0">
  <link rel="stylesheet" href="/css/coach-v8-micro-workflow.css?v=8.7.0">
  <link rel="stylesheet" href="/css/coach-v8-plan-coordination.css?v=8.8.0">
  <link rel="stylesheet" href="/css/coach-v9.css?v=9.0.1">
  <link rel="stylesheet" href="/css/coach-v9-batch.css?v=9.2.0">
  <link rel="stylesheet" href="/css/coach-v9-season-planner.css?v=9.3.0">
  <link rel="stylesheet" href="/css/coach-v9-hierarchy.css?v=9.4.0">
  <link rel="stylesheet" href="/css/coach-v9-stepwise.css?v=9.5.0">
  <link rel="stylesheet" href="/css/coach-v9-manual-planning.css?v=9.6.0">
  <link rel="stylesheet" href="/css/coach-v9-contextual-recommender.css?v=9.7.0">
</head>
<body class="coach-v8-loading coach-v9-beta">
  <main class="v8-loader"><div class="v8-loader-mark">RF</div><strong>RunFlow Coach</strong><span>Comprobando acceso y preparando la interfaz…</span></main>
  <script>
    (async()=>{
      const fail=()=>location.replace('/login');
      const nativeFetch=window.fetch.bind(window);
      try{
        const response=await nativeFetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});
        if(!response.ok)return fail();
        const data=await response.json();
        if(!Array.isArray(data?.user?.roles)||!data.user.roles.includes('coach'))return fail();
        localStorage.removeItem('runflow_client');
        const scripts=[
          '/js/coach-v8-shell.js?v=8.0.0',
          '/js/coach-v8-planner.js?v=8.4.1',
          '/js/coach-v8-validation-persistence.js?v=8.4.0',
          '/js/coach-v8-runtime.js?v=8.4.0',
          '/js/coach-v8-delete-ui.js?v=8.4.2',
          '/js/coach-v8-guided-flow.js?v=8.6.0',
          '/js/coach-v8-season-map.js?v=8.6.0',
          '/js/coach-v8-micro-workflow.js?v=8.7.0',
          '/js/coach-v8-plan-coordination.js?v=8.8.0',
          '/js/coach-v9.js?v=9.0.1',
          '/js/coach-v9-batch.js?v=9.2.0',
          '/js/coach-v9-supplement.js?v=9.2.0',
          '/js/coach-v9-season-planner.js?v=9.3.0',
          '/js/coach-v9-season-bridge.js?v=9.3.0',
          '/js/coach-v9-profile-availability.js?v=9.4.0',
          '/js/coach-v9-stepwise-final.js?v=9.5.0',
          '/js/coach-v9-session-generator-fix.js?v=9.5.1',
          '/js/coach-v9-manual-planning.js?v=9.6.0',
          '/js/coach-v9-contextual-recommender-v2.js?v=9.7.0'
        ];
        await Promise.all(scripts.map(src=>new Promise(resolve=>{const p=document.createElement('link');p.rel='preload';p.as='script';p.href=src;p.onload=resolve;p.onerror=resolve;document.head.appendChild(p)})));
        window.fetch=(input,init)=>{
          const url=typeof input==='string'?input:input?.url;
          return nativeFetch(url==='/coach.html'?'/coach-base.html':input,init);
        };
        for(let i=0;i<scripts.length;i++){
          const src=scripts[i];
          await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.appendChild(s);});
          if(i===0)window.fetch=nativeFetch;
        }
      }catch(error){window.fetch=nativeFetch;fail();}
    })();
  </script>
</body>
</html>
