<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#126f60">
  <title>Acceso beta · RunFlow</title>
  <link rel="stylesheet" href="/css/app.css?v=2.4.2.2">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-story">
      <p id="betaEyebrow" class="eyebrow" style="color:#bfe8df">RunFlow Beta</p>
      <h1 id="betaStoryTitle">Acceso a la nueva versión de RunFlow.</h1>
      <p id="betaStoryText">Este acceso está separado de las versiones estables.</p>
    </section>
    <section class="login-form">
      <div class="brand"><div class="logo">RF</div><div><strong id="betaBrand">RunFlow Beta</strong><small id="betaBrandSmall">Entorno de prueba</small></div></div>
      <p id="betaRole" class="eyebrow">Acceso</p>
      <h2 id="betaHeading">Identifícate</h2>
      <p id="betaHelper" class="muted">Volverás automáticamente a la versión beta solicitada.</p>
      <div id="loginMessage" class="notice hidden"></div>
      <label>Correo electrónico<input id="email" type="email" autocomplete="email"></label>
      <label style="margin-top:13px">Contraseña<input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña"></label>
      <button id="loginButton" class="btn primary" type="button" style="width:100%;margin-top:18px">Entrar</button>
    </section>
  </main>
  <script src="/js/login-beta.js?v=1.0.0"></script>
</body>
</html>
