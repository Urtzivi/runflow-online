services:
  - type: web
    name: runflow-online-pilot
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install --omit=dev
    startCommand: node -r ./plan-delete-hook.js -r ./auth-recovery-hook.js -r ./athlete-link-recovery-hook.js -r ./learning-api-hook.js -r ./library-policy-hook.js -r ./v9-engine-hook.js -r ./v9-supplement-hook.js -r ./v9-reschedule-hook.js server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "0"
      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
